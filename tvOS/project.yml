# Generate the Xcode project with:  xcodegen generate
name: AnimeRollTV
options:
  xcodeVersion: "27.2"   # built with Xcode 27.2 (iOS/tvOS 27.2 SDK); deployment target stays 18.0
  bundleIdPrefix: com.kurozetsubou.animeroll
  deploymentTarget:
    tvOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set your Apple Team ID
packages:
  AnimeRollKit:
    path: ../AnimeRollKit
targets:
  AnimeRollTV:
    type: application
    platform: tvOS
    sources: [AnimeRollTV]
    dependencies:
      - package: AnimeRollKit
    entitlements:
      path: AnimeRollTV/AnimeRollTV.entitlements
      # No capabilities by default, so any Apple account can sign it (free "Personal Team" included).
      # Passkeys need a paid developer account: add, under `properties:`,
      #   com.apple.developer.associated-domains: ["webcredentials:YOUR-NAS-DOMAIN"]
      # then run `xcodegen generate` again. See README.
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kurozetsubou.animeroll.tv
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: AnimeRollTV/Info.plist
      properties:
        CFBundleDisplayName: AnimeRoll
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "AnimeRoll si collega al tuo NAS sulla rete locale."
